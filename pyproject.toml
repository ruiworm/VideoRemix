[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "videoremix"
version = "1.0.0"
description = "Next-generation intelligent multi-modal video deduplication and remediation engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Antigravity Team" }]
dependencies = [
    "imageio-ffmpeg>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
videoremix = "videoremix.cli:main"
videoremix-gui = "videoremix.ui.app:main"
videoremix-web = "videoremix.ui.web:main"
videoremix-launcher = "videoremix.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["videoremix*"]
